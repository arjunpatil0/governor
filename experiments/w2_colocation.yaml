# Pre-registration: W2 co-location characterisation
# DRAFT FOR REVIEW - not yet committed. Written and committed BEFORE any W2 measurement data exists.
# Pilot data (data/pilot/w2/, journal 0011) may fix kernel unit counts only; it set no hypothesis or threshold here, except where a
# secondary is explicitly marked "motivated by the pilot". After the first full run do not edit this file; changes go in
# w2_colocation_v2.yaml or a dated addendum written before the affected data, with the reason recorded.
id: w2_colocation
registered: 2026-10-21
hardware: RTX 4070 Laptop (36 SMs, cc 8.9, 8188 MiB), driver 616.92, Windows 11 WDDM 3.2, AC power, HAGS ON (dxdiag NVIDIA adapter
  "DriverSupportState:Stable Enabled:True"; journal 0010), integrated AMD 780M present but not the compute device
purpose: >
  Characterise how a latency-sensitive foreground and a throughput background share the GPU on this laptop: (A) does foreground wait
  follow the non-preemptive residual-wait model, and if not, what does the scheduler do (secondary, motivated by the pilot);
  (B) what a device-wide SM clock lock does to a compute-bound foreground; (C) where a decode-like background's clock knee is.
inputs_from_earlier_work:
  residual_wait_theory: journal 0004 (wait = rho * E[S^2] / (2 E[S]) for non-preemptive background slices); rho added per journal 0008 A.1
  w1_relative_throughput: data/w1_downclock_results.md (commit e9714d9); B's HB1 predictions are read from that file by the analysis, not typed in
  pilot: data/pilot/w2/20261020T222839Z/pilot.json (+ run 1 20261020T222359Z, diagnostics/), journal 0011

# ------------------------------------------------------------------ shared protocol
common:
  processes: two (foreground, background), each its own CUDA context via workloads/background/build/w2_kernels.dll, spawned per cell
  timeline: "QueryPerformanceCounter seconds shared across processes (pilot: max skew 4.5 us vs perf_counter)"
  cpu: foreground pinned to logical CPU 4, background to logical CPU 8 (different physical cores); both NORMAL priority class unless a cell says otherwise
        (the pilot's co-run cell used a HIGH-priority foreground; the main grid deliberately does not)
  clocks:
    sm_lock_mhz: "per experiment (A: 1800; B and C: the level under test or unlocked)"
    memory_lock_mhz: 8001 in every W2 cell (nvidia-smi -lmc 8001,8001), reverted with -rmc
    mechanism: nvidia-smi -lgc N,N (N = level under test) / -lmc 8001,8001; requires an Administrator shell; ALL clock resets (-rgc, -rmc) run in a finally block
  warmup_s: 2.0       # foreground traffic (and background if present) at the cell's settings before the measured window; excluded from every statistic
                      # (pilot: the first requests after an idle gap run at 210 MHz and back up the queue for 0.17-0.37 s)
  gpu_start_temp_max_c: 68   # wait up to 60 s before each cell; flag if not reached
  idle_between_cells_s: 2.0
  calibration: >
    units-per-millisecond for the background and foreground kernels are calibrated in-run, at the experiment's locked SM clock, before block 0
    (linear fit of host-visible duration vs units, as in the pilot); "X ms" below always means calibrated nominal at that clock. Realised durations
    are logged per slice/request and are what every prediction uses (decision 2026-10-21, journal 0012).
  logging_per_cell: >
    meta (git head, yaml sha, dll sha, dxdiag Hardware Scheduling line for the NVIDIA adapter, admin, AC, ambient if given, execution mode "CUDA native
    kernels via w2_kernels.dll (no CPU fallback)"); every bg slice (start, end, gpu_ms); every fg request (scheduled arrival, launch, complete, gpu_ms);
    20 Hz NVML samples (SM clock, mem clock, power, temperature) over the window; clock event reasons (OR); energy counter delta (two reads per window)
  seeds: block order seed 20261021 (+block index); slice and arrival seeds derived from (20261021, block, cell index)
  provenance: a full run refuses to start on a dirty git tree (telemetry/provenance.py); this yaml must be committed before the first full run
  validity_checks:     # flagged, cell stays in the data (a flagged cell is excluded only from the headline test if stated below)
    - any 20 Hz SM-clock sample in the window outside +/-3% of the locked target, or any memory-clock sample outside +/-1% of 8001 MHz (locked cells)
    - start temperature condition not reached
    - fewer than 95% of the scheduled foreground requests completed within the window
    - background utilisation rho < 0.95 in a cell designed to saturate (duty = 1)
    - kernel checksum / state not finite; child process exit code nonzero
    - HAGS line differs from "Enabled:True"
    - "energy: counter mean power vs 20 Hz sample mean differ by more than 15% (B and C only; W1 addendum applies: sample-based sensitivity reported)"

# ------------------------------------------------------------------ Experiment A: residual-wait model
experiment_A:
  clock: SM 1800 MHz, memory 8001 MHz, both locked (admin)
  foreground: fma kernel (6 blocks/SM, full GPU), calibrated 0.1 ms, Poisson arrivals at 200 Hz on an absolute QPC grid, 2000 requests per cell (10 s window)
  background: fma slices, back-to-back launch + sync, no gap, grid fills the GPU; slice durations gamma-distributed with target mean m and CV c
  cells_per_block: 19            # 6 m x 3 c = 18 background cells + 1 baseline cell (foreground alone, same warm-up, same lock)
  factors:
    m_ms: [0.25, 0.5, 1, 2, 4, 8]
    c: [0.0, 0.5, 1.0]
  blocks: 10
  cell_order: seeded random permutation within each block
  estimated_runtime: about 1 h (budget from cell structure, not measured)
  definitions:
    latency: complete - SCHEDULED arrival (no coordinated omission)
    baseline_latency: mean latency of the same block's baseline cell
    observed_wait: mean latency in the cell - baseline_latency
    predicted_wait: rho * E[S^2] / (2 E[S]) from the REALISED slice durations (host end - host start) of background slices overlapping the window,
                    rho = sum(slice durations) / wall span of those slices; inter-slice gap statistics logged
  hypotheses:
    HA1: >
      observed_wait follows predicted_wait. Supported iff BOTH: (i) the OLS fit of observed_wait on predicted_wait WITH an intercept, over all 18 background
      cells x 10 blocks, has a slope whose 90% block-cluster-bootstrap CI lies entirely inside [0.8, 1.25] (equivalence test on the slope,
      analysis/w2_stats.py equivalence_slope); the intercept and its 90% CI are reported (a constant switch cost, pilot ~0.3 ms, belongs there and
      must not bias the slope), AND (ii) the
      cell-median (over blocks) observed_wait lies within +/-25% of the cell-median predicted_wait in at least 70% of the 18 cells.
    HA1_failure_classification: >
      If HA1 is not supported, classify (evaluated in this order, reported with the numbers): (1) preempted_or_concurrent: slope 90% CI upper bound < 0.8 AND
      median(observed_wait / predicted_wait) < 0.5 over cells with m >= 2; (2) scheduler_capped: observed_wait at m=8 is <= 1.25 x observed_wait at m=2
      (cell medians, c = 0) while predicted_wait grows by >= 3x; (3) other.
    HA2: >
      at fixed m, observed_wait grows with c (the model predicts ratios 1.25 at c=0.5 and 2.0 at c=1 relative to c=0, recomputed from realised moments).
      Test: one-sided paired Wilcoxon signed-rank, observed_wait(c=1) > observed_wait(c=0), across the 10 blocks, separately for each m; Holm over the 6 values
      of m. Supported iff significant at >= 4 of 6.
    reported_not_tested: p99 and p99.9 of fg latency vs the longest realised slice; fraction of fg arrivals landing inside a slice
  secondary_preemption_characterisation:
    status: >
      MOTIVATED BY THE PILOT (journal 0011: in one unregistered co-run cell fg latency did not depend on where the request landed in the slice,
      and background slices containing an fg completion ran ~0.3 ms longer). Descriptive; no multiplicity claim; reported whatever the HA1 outcome.
    run_as: part "secondary" of the harness (separate session from the primary part), 10 blocks, its own block seeds
    SA1_phase_independence:
      cells: A cells with c = 0 and m in {2, 4, 8}
      analysis: >
        for each fg request landing inside a background slice, phase = arrival - start of that slice (ms); regress fg latency on phase.
        A non-preemptive wait predicts slope -1 (latency falls by 1 ms per ms of phase); phase independence predicts 0. Report slope with 90%
        block-bootstrap CI per m and pooled; label "phase-independent" if the CI lies inside [-0.25, 0.25], "waits-out-the-slice" if inside [-1.25, -0.8], else "mixed".
    SA2_slice_stretch:
      cells: A cells with c = 0 (identical units per slice) and the fg-size cells of SA4
      analysis: >
        among background slices containing exactly one fg completion, stretch = duration - median duration of slices containing none (same cell);
        regress stretch on the fg kernel's gpu service time across fg sizes {0.1, 1, 4 ms}: stretch = s0 + k * service. s0 is the estimated constant switch cost,
        k the extra background time per ms of fg service (k near 1 = the background simply yields the GPU for the fg's run time). Report s0, k with 90%
        block-bootstrap CIs.
    SA3_priority_control:
      cells: fg process at HIGH_PRIORITY_CLASS vs NORMAL, for m in {2, 8} x c in {0, 1} (4 cells; normal-priority versions are the main-grid cells)
      analysis: per cell, paired (high - normal) difference in observed_wait across the 10 blocks with a bootstrap CI; two-sided Wilcoxon p reported without a decision rule
    SA4_foreground_size:
      fg_sizes:
        - 0.1 ms, Poisson 200 Hz, 2000 requests
        - 1 ms, Poisson 100 Hz, 1000 requests
        - 4 ms, Poisson 40 Hz, 400 requests
        - 9 ms frame, periodic 60 Hz, 600 frames (the B fma frame)
      cells: fg size x background {none, fma slices m=2 c=0, m=8 c=0} (the 0.1 ms cells are the A cells); plus duty-cycle sweep below
      duty_cycle_sweep: background m=2, c=0 with idle gaps inserted so that duty d = busy/(busy+idle) in {0.25, 0.5, 0.75} (d = 1 is the m=2 cell), for fg in {4 ms, 9 ms frame}
      analysis: >
        for each fg size report mean/p99 latency, fg gpu service time and fg slowdown (co-run / baseline of the same block); find the fg size at which the
        latency penalty stops looking like waiting (SA1 phase independence) and starts looking like time-sharing. For 4 ms and 9 ms report fg slowdown vs d
        with a reference line 1 + d (equal sharing while both are busy); descriptive, no test.
    secondary_cells_per_block: "4 (SA3) + 9 (SA4 sizes 1/4/9 ms: 3 baselines + 6 background cells) + 6 (duty sweep) = 19"
    secondary_estimated_runtime: about 1 h (budget, not measured)
  limitations_specific:
    - HAGS is ON and held fixed; results hold for HAGS on only. If HA1 is classified scheduler_capped, a HAGS-flip follow-up is registered then
    - "clocks are locked, so the default idle-to-boost ramp is excluded by design (it is a real effect: pilot P3, but not measured by A)"
    - background is a saturating single-stream fma loop; real workloads have gaps and several streams

# ------------------------------------------------------------------ Experiment B: device-wide clock lock vs foreground
experiment_B:
  clocks: memory 8001 MHz locked; SM level in [900, 1200, 1500, 1800, unlocked]. The knee level found in Experiment C (int4 proxy, graph) is appended
          by an addendum dated before B's first run if it is not already in the list.
  foreground_frames:
    fma_60hz: " fma frame, unlocked service time ~53% of the 16.67 ms budget (pilot: 185,633 units = 8.86 ms unlocked), periodic 60 Hz, 600 frames/cell"
    fma_120hz: "fma frame, ~53% of 8.33 ms (pilot: 92,586 units = 4.42 ms unlocked), periodic 120 Hz, 1200 frames/cell"
    mem_60hz: " memory-bound frame (control; pilot: 15,803 units = 8.92 ms unlocked), periodic 60 Hz, 600 frames/cell"
    note: units are fixed from the pilot (sized at the unlocked clock); they are not re-calibrated at the locked clocks
  background: none, or memory-bound streaming slices (mem kernel, m=1 ms, c=0, saturating)
  cells_per_block: 30             # 3 frame kinds x 2 background x 5 SM levels
  blocks: 10
  estimated_runtime: about 1.3 h (budget, not measured)
  hypotheses:
    HB1: >
      REFERENCE LEVEL IS THE LOCKED 1800 MHz CELL, not unlocked (review finding 2: frames run at ~53% duty and the pilot showed the unlocked SM clock drops
      during idle gaps and at light load, so an unlocked frame need not run at the continuous-load clock W1 measured). With the background off, the fg median
      service time at each level L in {900, 1200, 1500} relative to the same block's 1800 MHz cell equals rel_W1(1800) / rel_W1(L), with rel_W1 the W1 median
      relative throughput of the same kernel type (data/w1_downclock_results.md, commit e9714d9; the analysis reads it from that file). For the fma frame that is
      about 2.00 at 900, 1.50 at 1200 and 1.20 at 1500; for the mem frame about 1.12 at 900 and 1.00 at 1200 and 1500. Test: 90% block-bootstrap CI of the
      median ratio contained in [0.9, 1.1] x prediction for the fma frames and [0.95, 1.05] x prediction for the mem frame. Supported iff it holds at all
      three levels for both fma frames. The unlocked cell is reported descriptively, with the per-frame median SM clock logged.
    HB2: >
      the fraction of fma frames missing the deadline (latency from scheduled release > frame budget) rises as the SM clock drops below the 1800 MHz reference.
      Test: one-sided paired Wilcoxon of miss fraction (L) > miss fraction (1800) for L in {900, 1200, 1500}, Holm over these three, background off and on
      separately. Supported iff significant at every level where the predicted fg service time (measured median at 1800 x the HB1 ratio) exceeds the frame budget.
      The mem frame is a control with no directional claim. Unlocked is descriptive.
    overload_rule: >
      Where predicted fma service exceeds the frame period (from W1: about 18.2 ms at 1200 MHz and 24.2 ms at 900 MHz against 16.67 ms at 60 Hz; the 120 Hz frames
      are overloaded from 1200 MHz down), periodic frames queue without bound and latency measured from the scheduled release grows with window length. At
      overloaded levels ONLY the miss fraction and the gpu service time are interpreted; latency percentiles are reported but flagged non-stationary (overload).
    reported_descriptive: >
      per level: GPU power saved vs unlocked (counter and sample based, W1 addendum applies), fg p50/p99/max latency, deadline-miss fraction, and background
      throughput (GB/s from slice units and durations) for the background-on cells
  limitations_specific:
    - synthetic frames, not a game; the background is a streaming kernel, not decode
    - each cell spawns a fresh process pair; start cost is excluded only by the 2 s warm-up

# ------------------------------------------------------------------ Experiment C: decode-like background and its clock knee
experiment_C:
  workload: >
    synthetic decode proxy (workloads/background/w2_kernels.cu), Llama-3.2-3B shapes (hidden 3072, ffn 8192, 24 query / 8 kv heads, head_dim 128, context 512),
    8 kernel launches per layer (rmsnorm, qkv gemv, attention, o gemv + residual, rmsnorm, gate/up gemv, silu-mul, down gemv + residual), one host sync per token
  variants:
    int4: " 28 layers, group-32 int4 weights with dequantisation (pilot: 1468 MB/token)"
    fp16: " 14 layers (28 do not fit 8 GB next to the OS; the layer count is logged, never reduced silently) (pilot: 2848 MB/token)"
  launch_modes: [stream launches, CUDA graph per token]
  sm_levels_mhz: [600, 750, 900, 1050, 1200, 1350, 1500, 1800, unlocked]    # memory 8001 locked
  cells_per_block: 36             # 2 variants x 2 launch modes x 9 levels
  blocks: 10
  preroll_s: 1.5
  window_s: 4.0
  idle_between_s: 2.0
  estimated_runtime: about 1 h (budget, not measured)
  outcomes: tokens/s, relative throughput vs unlocked within block, joules per token (counter), effective GB/s
  definitions:
    knee: lowest SM level whose median (over blocks) relative throughput is >= 0.95 (analysis/w2_stats.py find_knee); 90% block-bootstrap CI of the knee
    energy_optimum: level with the lowest median joules per token
  hypotheses:
    HC1: >
      the int4 proxy's knee is at a higher SM level than the fp16 proxy's (its dequantisation adds ALU work per byte). Test: per-block knee levels,
      one-sided paired Wilcoxon (int4 knee > fp16 knee) using the CUDA-graph launch mode; alpha 0.05, scipy zero_method="wilcox" (zero differences dropped).
      Knee levels are discrete, so ties are likely: if fewer than 6 blocks have a nonzero int4 - fp16 knee difference, HC1 is reported INCONCLUSIVE (not "not supported").
      The per-block knee table is reported. If both knees are <= 1200 MHz this is reported as such.
    HC2_descriptive: knee and energy optimum for all four variant x launch-mode configurations; whether CUDA-graph capture moves the knee (WDDM launch cost)
  real_engine_validation: >
    one llama.cpp cell (3B, Q4) after C, to check the proxy's knee; its design (build, model file, levels, repetitions) is registered in a dated addendum
    BEFORE it runs. It must be a real CUDA build, no CPU fallback.
  limitations_specific:
    - the proxy is not a real engine; fp16 uses half the layers; weights are random, so values are meaningless and only timing is measured

# ------------------------------------------------------------------ analysis (all experiments)
analysis:
  alpha: 0.05
  multiplicity: Holm within each family named above (HA2 over m; HB2 over locked levels per background condition); HA1, HC1 are single tests
  effect_sizes: medians with IQR, bootstrap CIs over blocks (2000 resamples, seeded), matched-pairs rank-biserial for Wilcoxon tests
  reporting: every cell reported including flagged ones; no cells dropped except by a validity check stated above
  code: analysis/w2_analysis.py (written test-first, committed before the first full run), helpers in analysis/w2_stats.py and workloads/common/loadgen.py (tested)
  results_files: data/w2_A_results.md, data/w2_A_secondary_results.md, data/w2_B_results.md, data/w2_C_results.md; raw data committed with the results

implementation_prerequisites:    # code that must exist and be tested before the first full run; not part of the design
  - "w2_kernels.cu: duty-cycle option for background slices (idle gap after each slice), rebuilt; dll sha logged"
  - "experiments/w2_colocation/run.py: part selection (primary | secondary | B | C), finally-block clock reset, validity flags"
  - analysis/w2_analysis.py with tests on synthetic data kept outside the repo, as in W1

limitations_acknowledged:
  - HAGS ON only; no HAGS-flip control in W2 (journal 0010)
  - single laptop, single driver, WDDM; two processes with no MPS; synthetic workloads
  - locked clocks remove the idle-to-boost ramp, a measured real effect (journal 0011) that W2 does not characterise
  - energy comparisons inherit the W1 addendum caveats (counter bias, sample lag)
  - no ambient sensor (manual note per session)
  - block-cluster percentile bootstrap CIs with only 10 clusters tend to be too narrow (anti-conservative); the equivalence tests (HA1, HB1) are therefore read with that in mind (review finding 5; no design change)
