# Pre-registration: W5 governor evaluation (primary objective: maximise background tok/s subject to the foreground SLO AND a GPU power budget)
# COMMITTED 2026-10-23 after the final review (reviews/2026-10-23_w5_yaml_final_review.md; earlier reviews: 2026-10-22_w5_yaml_review.md, response 2026-10-22_w5_yaml_response.md).
# Changes made at this commit (the dated note, approved by the reviewer and Arjun after these edits): see `commit_note` at the end of this file.
# No W5 governor data exists at this commit (the W4-5 hardware smokes set no hypothesis or threshold here; simulator results are not evidence for any claim below).
# After the first full run do not edit this file; changes go in w5_governor_v2.yaml or a dated addendum written before the affected data.
id: w5_governor
registered: 2026-10-23 (committed with the commit_note changes)
hardware: RTX 4070 Laptop (36 SMs, cc 8.9, 8188 MiB), driver 616.92, Windows 11, AC power, HAGS ON; Armoury Crate mode stated before every run and passed as --armoury-mode
purpose: >
  Does a governor that sets the SM clock and the background token pacing keep a frame-deadline foreground within its SLO while a real llama.cpp background runs, keep mean GPU
  power within a budget, and maximise background tok/s - and does a learned (model-based) controller beat a feedback controller, and the best simple design, on a workload it has
  NEVER seen (the reason to learn at all)? Secondary view: the (tok/s, W) Pareto front with lambda = 0.5 marked. If the learned part does not earn its place, the report says so.
inputs_from_earlier_work:
  w1_w2_results: data/w1_downclock_results.md (fg speed and power vs clock), data/w2_B_results.md, data/w2_A_secondary_results.md (fg vs duty), data/w2_L_results.md (llama.cpp decode vs clock), data/w2_G_results.md
  simulator_study: docs/W45_SIM_PROTOCOL.md, data/w45_sim_results.md, data/w45_sim_followup.md, data/w45_sim_budget.md, data/w45_sim_round2.md (SIMULATION; motivates the factor levels and controller set only)
  hardware_smoke: "data/w45_smoke/smoke1 (plumbing check, not a result; its aligned-driver and governor numbers are INVALID because of the driver's torn-read-as-idle bug found in smoke 2, see data/w45_smoke/smoke1/README_INVALID.md, journals 0041-0042; the earlier reading 'the guard must be learned / guard 0 is unsafe' is WITHDRAWN)"
  hardware_smoke_2: "data/w45_smoke/smoke2 + smoke2_report.md (DONE, diagnostic, not a result): the guard-0 overrun was a driver bug (a failed pace-block read was treated as 'fg idle', so tokens started at every fg publish whatever the guard); fixed in workloads/background/pace_view.h; journal 0041, plan addendum G"
  hardware_smoke_3: "data/w45_smoke/smoke3 + smoke3_report.md (DONE, diagnostic, journal 0043): the final driver at nominal frame costs 4 / 7 / 9 ms (measured alone 3.0 / 5.2 / 6.7 ms): aligned pacing gates correctly (60 tok/s = 1 token/frame at 3.0 and 5.2 ms, 0 tok/s at 6.7 ms, 0 misses); unaligned duty 1 at nominal 9 overloads the fg (100% misses); clean-token estimate steady at 10.1 ms, overrun 0.5%. Everything measured with the old driver (smoke 1 token timing, smoke 2) described a driver that ignored its own fit test."
  plan: "docs/W45_PLAN.md (approved 2026-10-22 with three modifications and the 2026-10-22 addendum: power-budget objective, AI model-selection plan)"
  security: docs/W45_CLOCK_HELPER_SECURITY.md
stages:
  W5a_data_collection:
    purpose: Pre-registered hardware data collection for model selection (docs/W45_PLAN.md addendum B); no hypothesis of W5b is tested on W5a data.
    design: >
      Stratified space-filling SUBSET of the factorial (the full factorial, 7 clocks x 10 pacing settings x 3 workloads x 6 fg conditions = 1260 points, would be ~23 h before cool-downs).
      Foreground conditions are ABSOLUTE nominal frame costs (ms of work alone at 1800 MHz; reviewer 2026-10-23: c0 is chosen only in the W5b tuning blocks, after W5a, so W5a must span the whole
      c0 search range and the S1 steps): {5, 7, 9, 11, 14} ms constant plus VARYING = the S1 step sequence (x1.0 / 0.7 / 1.3 / 0.7 / 1.0 / 1.3 every 10 s) on a base of 9 ms (levels 6.3 - 11.7 ms).
      5 ms covers 0.7 x 7, 14 ms covers 1.3 x 11. Whichever c0 the gate picks, the selected model has seen every cost W5b can use.
      Strata = workload x fg condition (3 x 6 = 18). Factors inside a stratum: SM clock {900, 1050, 1200, 1350, 1500, 1800, unlocked} and pacing configuration {aligned: guard {0, 1 ms} x duty
      {0.25, 0.5, 1} = 6; unaligned: duty {0.1, 0.25, 0.5, 1} = 4} = 10. Selection: every stratum x clock pair gets at least one cell (126), the remaining ~154 cells are a seeded
      Latin-hypercube / stratified random draw over (clock, pacing configuration) balanced per stratum, total 280 cells (seed recorded in meta.json and the addendum that freezes the list
      before the run). Cell = 5 s warm-up + 30 s measured; about 65 s per cell including process start, model load and cool-down (to be replaced by the measured value) = about 5 h, split over
      THREE sessions of at most 2 h; cells are randomised across sessions and the session of each cell is recorded. The W5a table is NOT used to choose g'B / eB / c'B constants (they are tuned
      on the tuning blocks over the same known workloads, see W5b_design.controllers).
    workloads: >
      Background in W5a: Llama-3.2-1B Q4_K_M, Llama-3.2-3B Q4_K_M (the model of L) and ONE other LLM family (to be named in an addendum before W5a after checking that it loads with all
      layers on the GPU). Foreground: synthetic FMA frame (60 Hz) at the ABSOLUTE nominal costs and the varying condition defined in `design` (not relative to c0). An image-generator background
      needs its own paced runner and is NOT part of W5a/W5b (W6).
    held_out_workload: >
      Llama-3.1-8B-Instruct Q4_K_M is held out ENTIRELY: no W5a cell, no tuning block, no model selection, no constants of g'B / c'B / d'B ever touch it. It is used only in W5b scene S5.
      Whether it loads on this 8 GB GPU with context 2048, all layers on the GPU, is CHECKED BEFORE W5a (reviewer 2026-10-23: the fallback changes W5a's workload list, so the check cannot wait for the
      tuning blocks) and RECORDED IN AN ADDENDUM before any W5a cell. FALLBACK RULE (reviewer 2026-10-22): if the 8B model does not load with all layers on the GPU, the held-out workload becomes
      the other LLM family and W5a uses only the two Llama-3.2 sizes. The choice is made by that LOAD PRE-CHECK ONLY (pass/fail) and NEVER by any performance measurement or result.
    output: the training/evaluation table for LOWO model selection.
  W5a_model_selection: >
    Leave-one-workload-out and leave-one-scene-out evaluation of the candidates (grey-box + RLS; LightGBM + online residual; sparse GP; small MLP ensemble; each with CUSUM change
    detection), on W5a data only. Selection rule fixed in the plan: the simplest model whose p99 prediction error is within ~10% of the best AND whose predict+decide latency p99 < 1 ms AND
    whose 95% interval coverage is within 90-98%. The selected model is frozen (commit hash recorded in an addendum) BEFORE W5b starts.
  W5b_evaluation: the confirmatory part below.
W5b_design:
  foreground: synthetic frame-paced FMA frame (workloads/foreground/frame_loop.py), 60 Hz periodic, deadline = period = 16.667 ms, base cost c0 chosen by the feasibility gate (HW0) on the TUNING blocks.
  scenes:
    S0: steady (cost factor 1.0)
    S1: cost factor steps 1.0 / 0.7 / 1.3 / 0.7 / 1.0 / 1.3 every 10 s
    S1d: linear drift of the cost factor 0.7 -> 1.3 over the cell
    S2: idle/active phases (20 s active, 10 s idle, 20 s active, 10 s idle)
    S5: UNSEEN WORKLOAD - the S1 foreground with the held-out background (Llama-3.1-8B, or the fallback in held_out_workload). g'B and c'B run with constants tuned on the OTHER workloads (the realistic deployment); d'B runs the W5a-selected model starting from its prior and learning online during the cell.
    S3: "thermal cap emulated by lowering the helper allowlist cap at 30 s - EXPLORATORY (reviewer: keep exploratory)"
    S4: "(interaction mismatch) does not exist on hardware; real interaction is the test of the plant separability assumption"
  background: llama.cpp Q4_K_M, batch 1, greedy, governed driver (workloads/background/llama_governed_bench.exe, warmed once per binary hash); Llama-3.2-3B for S0-S3, the held-out model for S5
  budgets_w: >
    PRIMARY: "60 W ('AC-quiet'). EXPLORATORY: 35 W ('battery-like'; an AC-powered emulation, not a battery run). Budget = mean GPU board power over the 60 s measured window (NVML energy counter / time)."
    An unconstrained arm (lambda = 0.5 reporting) is secondary.
  controllers:
    a: no governor (unlocked clock, background always on)
    "g'B": "best scenario-agnostic STATIC setting over the FULL pacing space (reviewer 2026-10-23): pacing mode aligned (guard {0, 1 ms} x duty {0.25, 0.5, 1}) OR unaligned (duty {0.1, 0.25, 0.5, 1}) x clock {900, 1050, 1200, 1350, 1500, 1800, unlocked}, per budget. Chosen on the tuning blocks over the SAME known workloads the model sees (Llama-3.2-1B, Llama-3.2-3B, the other LLM family) by the two-stage search in `blocks`; feasible = meets the SLO, the budget AND >= 20% of background-alone tok/s in every (known workload x scene) cell it was run in; objective = mean tok/s. A static that cannot choose unaligned pacing would lose at heavy frames for a reason unrelated to learning, so it may."
    eB: g'B (full pacing space) + idle-triggered clock drop to the knee (1500 MHz) with a free background
    "c'B": feedback - PI on frame latency (guard) + PI on mean power (token throttle) + deadline-aware clock rule; its constants are tuned on the tuning blocks over the same known workloads (1B, 3B, other family); the held-out workload never touches them. Pacing mode - aligned with the PI guard, and it falls back to unaligned duty pacing when the aligned slack cannot hold a token (as the learned model may); the rule is fixed before the tuning blocks run (addendum).
    "d'B": "HYBRID (decision 2026-10-22, docs/W45_PLAN.md addendum F, recorded before any W5b data). IDLE branch = the eB rule: when the idle detector of eB (controllers/static.py IdleDetector, 5 ticks without frames) fires, the clock drops to the knee (1500 MHz) with a free background, with the same constants as eB; the fixed g'B action is NOT used. ACTIVE branch = the W5a-selected learned model: constrained choice of (clock, throttle, guard) maximising predicted tok/s s.t. predicted p99 and power, with online calibration (token-time model, power scale/bias) and an explicitly LEARNED GUARD: the guard grows by the observed token-end overrun past the next frame arrival (token ring end time vs the fg schedule) and decays slowly when there is none (the guard is a safety margin against estimation error, for example a stale token estimate after a clock change; smoke 2's guard-0 overrun was a driver bug, now fixed, and is NOT a reason to learn). Reason: simulator round 3 (post-hoc, plant timing known to be wrong) showed the learned model winning on the unseen workload (S5) and losing only in the idle branch, which a rule already handles. CONSEQUENCE for the reading: in S2 the idle phases of d'B and eB are the same rule, so S2 tests the switching and the active-branch/idle hand-over, not learning; S5 and S0 are where learning is tested. The hybrid has NEVER been simulated (the simulator is frozen); the S2 non-inferiority is an expectation, not a result. Any further change to the active branch uses W5a hardware data and the tuning blocks only."
    unconstrained arm (secondary): e, c', d' with lambda = 0.5 reporting
  blocks: >
    13 blocks. TUNING blocks 1-3 (NOT in any confirmatory test), on the KNOWN workloads only: T1 = feasibility gate HW0 and the c0 search (3B), the measured cell time, the background-alone references of every known workload;
    T2 = static STAGE 1: all 70 static settings (7 clocks x 10 pacing configurations) on the 3B in scene S1 at the chosen c0, at both budgets; T3 = static STAGE 2: the 8 best stage-1 settings per budget on 1B, 3B and the
    other family in scenes S0 and S1, then the g'B / eB choice (rule in controllers) and the constants of c'B and d'B (guard decay, gains) on the same three workloads. About 150 cells in total (to be replaced by the
    measured count). Blocks 4-13 are the 10 EVALUATION blocks.
    Primary family per block: scenes {S0, S1, S1d, S2, S5} x controllers {g'B, eB, c'B, d'B} at 60 W = 20 cells + the reference arm a in the same 5 scenes = 25 cells. Exploratory
    cells (35 W: the same 20 cells; S3 at 60 W: 5 cells) are run in evaluation blocks 4-8 only (25 more cells per block). Randomised cell order within a block, seed per (block, cell), 5 s warm-up excluded,
    cool-down between cells (GPU temperature below 55 C or 20 s, whichever is later), 10 s clock-unlocked idle before each cell.
  run_time_estimate: >
    ESTIMATE (to be replaced by the measured cell time of tuning block 1): about 100 s per cell (60 s measured + 5 s warm-up + about 10 s process start/model load/prefill - 6 s measured in the smoke - + cool-down).
    Tuning about 150 cells = about 4.2 h; evaluation blocks 4-13: 10 x 25 cells = 7 h + 5 exploratory extensions of 25 cells = 3.5 h; W5b total about 14.7 h; W5a about 5 h. Sessions of at most 3 h (W5a: 2 h).
  session_break_rule: >
    A block is never split across sessions; a session ends only between blocks. Blocks are numbered 1-13 in the order run. Every session starts with: helper restart from the documented admin setup,
    startup clock reset, warm-up of every binary (exe_warm registry), one discarded full cell, processes list and Armoury Crate mode recorded. The configuration (git hash of code, this yaml, exe hashes,
    driver version, the frozen W5a model hash, helper config hash) must be IDENTICAL across sessions; blocks run under a different configuration are reported separately and excluded from the confirmatory tests.
    Session id and the break reason are recorded in meta.json of each block. A block interrupted by an abort is discarded whole and rerun with the same seed list as the next block number.
  run_protocol: Administrator PowerShell; AC power; clean committed tree (this yaml, the frozen model and constants committed); Armoury Crate mode stated; Chrome closed; tray apps quit; no clicking in the console; helper started from the documented admin setup; startup clock reset (helper RESET + nvidia-smi -rgc/-rmc); processes list in meta.json; every binary warmed once per hash (workloads/common/exe_warm.py); clocks reset in a finally block and at exit.
  provenance: meta.json per run (Armoury Crate mode and Chrome state RECORDED for every run - experiments/w2_colocation/run.py already refuses full runs without --armoury-mode, the W5 harness must do the same - git hash, yaml hash, exe hashes and warm status, helper config hash, Armoury mode, process list with CPU%, NVML versions, session id); per-cell frame records, token ring (end time and duration per token), daemon CSV with per-source age.
metrics:
  per_cell: fg miss fraction (latency from the SCHEDULED arrival > 16.667 ms, unfinished frames past deadline count as misses), fg p50/p99, bg tok/s (token ring, after warm-up), mean GPU power W (energy counter), J/token, clock changes, rate-limited clock requests, helper errors
  feasible_cell: miss fraction <= 1% AND mean power <= budget
hypotheses:
  HW0_feasibility_gate: >
    On the tuning blocks at the chosen c0: arm a has miss fraction > 5% in S1 AND at least one static setting meets the SLO AND the 60 W budget AND delivers background tok/s >= 20% of the
    background-ALONE tok/s of the same workload in S1 (reviewer 2026-10-23: an aligned setting that admits no token meets the SLO trivially and must not pass; the reference is measured in every tuning block
    in a 'background alone' cell: unlocked clock, no foreground, same prompt and context).
    c0 DEFINITION (reviewer 2026-10-23): c0 is the NOMINAL frame cost = ms of work alone at 1800 MHz as calibrated by FmaFrameRunner.calibrate (this is what the runner is given; the S1 steps scale it
    by 0.7 / 1.3). Every block ALSO records the MEASURED frame time alone, c0m = p50 latency from the scheduled arrival with no background and the clock unlocked, from a calibration cell run before
    the block. Indicative mapping from smoke 3 (unlocked clock above 1800 MHz): c0m = 0.745 x c0 (nominal 4 / 7 / 9 ms measured 3.0 / 5.2 / 6.7 ms). Boundaries about slack and token length are judged in
    c0m (a clean 3B token is 10.1 ms, so a token fits the slack only if c0m <= 16.67 - 10.1 = 6.57 ms, about nominal 8.8 ms).
    c0 SEARCH (pre-listed): the tuning blocks try c0 in {7, 8, 9, 10, 11} ms nominal and use the SMALLEST c0 that meets the gate; if none meets it, the run stops and the result is reported
    (no other c0 is invented).
  HW7_clean_token_estimate_staleness: >
    DESCRIPTIVE check, pre-stated (reviewer 2026-10-23; the staleness of the clean-token estimate after a clock change is UNTESTED so far). W5a and W5b log est_clean_ms, est_ewma_ms, tok_ms and the overlap
    flag per token (driver CSV) and every accepted clock change (time of the helper acknowledgement). For each clock change at t_c in a cell where the background runs before and after: error =
    |est_clean_ms at the first token starting >= t_c + 1.0 s - median tok_ms of non-overlapped tokens in [t_c + 1.0 s, t_c + 3.0 s]| / that median. Reported: the distribution of the error over all
    changes and the share of changes with error <= 10%; the overrun fraction (tokens ending after the arrival they were gated against) in [t_c, t_c + 3 s] against the cell overall; changes with fewer
    than 8 non-overlapped tokens in [t_c + 1 s, t_c + 3 s] are listed separately (the estimate cannot have recovered). Expectation to be checked, not a threshold of the study: >= 90% of changes within 10%.
    A failure of this check is reported as a limitation of the driver estimate; it does not change any registered test.
  HW1_governors_hold_the_constraints: >
    For each of g'B, eB, c'B, d'B at 60 W in S0, S1, S1d, S2, S5: at least 90% of evaluation cells are feasible and the mean miss fraction <= 1%. Reported per controller (descriptive threshold, no p-value).
  HW2_primary_learned_vs_feedback: >
    PRIMARY FAMILY = 60 W, scenes {S0, S1, S1d, S2, S5}. SCORE of a cell = its background tok/s if the cell is feasible (miss fraction <= 1% AND mean power <= budget), and 0 if it is not (reviewer 2026-10-23:
    the background's output has no value when the frame SLO or the budget is broken; infeasible cells are NOT dropped). Tests are paired by block on this score. (i) SUPERIORITY in S5 (REQUIRED,
    reviewer 2026-10-22): d'B vs EACH of c'B, g'B and eB, one-sided paired Wilcoxon (d'B > comparator; blocks where both scores are 0 are ties and drop out), Holm over the 3 S5 comparisons (first threshold
    0.05/3; with 10 evaluation blocks the smallest attainable one-sided p is 1/1024 = 0.00098, and the test can reject only with >= 6 non-tied blocks, 1/64 = 0.0156 < 0.0167; with fewer the comparison is
    reported INCONCLUSIVE) AND the 90% block-bootstrap CI of the median paired difference above 0. (ii) NON-INFERIORITY in S0 and S2 with a pre-registered margin (S2 is labelled a HAND-OVER SAFETY CHECK,
    reviewer 2026-10-22: it tests that switching between the learned branch and the idle rule costs no tokens and keeps the budget, not learning): the 90% block-bootstrap CI LOWER BOUND of the paired ratio
    score(d'B) / score(comparator) is >= 0.95, against EACH of c'B, g'B and eB separately (fixed in advance, no data-dependent choice of comparator; d'B must pass all three, an intersection-union test so
    no multiplicity adjustment). Ratio rule: blocks where the comparator's score is 0 are excluded from the ratio (nothing to be inferior to) and their number is reported; a block where d'B scores 0 and the
    comparator scores > 0 counts as ratio 0. (iii) HW1 must also hold for d'B (>= 90% of its evaluation cells feasible and mean miss fraction <= 1%) in EVERY primary scene. d'B earns its place only if (i), (ii)
    AND (iii) hold; otherwise the report says it does not. A win in S1 or S1d is reported as such and does not decide the question (S5 is the scene where static settings have no oracle knowledge of the
    workload). The simulator round 3 (analysis/w45_sim_round3.py) used the earlier 'best comparator by median' form of the margin and the old paired-over-feasible rule; the hardware reading above is stricter.
  HW3_learned_vs_simple_design: >
    The same test on the same score (one Holm family of 5 per comparator) for d'B vs g'B and d'B vs eB. The report may say "the learned part beats the best simple design" only for scenes where d'B wins against BOTH.
  HW4_plant_validation: >
    Exploratory, no test: simulator predictions (data/w45_sim_*.md) vs measured per-cell tok/s, power and miss fraction for g'B and a; the separability assumption (clock x duty) is judged by the
    residual pattern; the token ring durations are compared with smoke 3 (data/w45_smoke/smoke3: the final driver gates correctly, tok_ms 10.1 ms clean). Reported, not used to tune anything.
  HW5_exploratory_arms: 35 W budget and S3, same tests and reading, labelled exploratory, no confirmatory claim.
  HW6_secondary_pareto: the (tok/s, W) Pareto front of the unconstrained arm with lambda = 0.5 marked; descriptive.
abort_and_flag_rules:
  - abort the run if a clock lock is not released after a cell (helper PING reports a lock, or sm clock stays locked) - reset, log, stop
  - abort if GPU temperature > 85 C or event reasons show HwThermalSlowdown/HwPowerBrake in a cell (cell flagged, run stops after the block)
  - flag (cells stay in the data) any cell with a helper error, a daemon row drop, a ring overflow, a clock request rate-limited more than twice, or fg frames abandoned
  - a block with a missing daemon file is excluded wholly and reported
analysis_plan: analysis/w5_analysis.py (to be written test-first before the run, synthetic fixtures); registered tests as above; every number in the report traces to a results file.
limitations:
  - "granularity (reviewer 2026-10-23; units corrected 2026-10-23, journal 0043): a clean token (10.1 ms) is longer than the frame slack once the MEASURED frame time c0m >= about 6.57 ms (about nominal 8.8 ms), so aligned pacing admits at most one token per frame (about 60 tok/s at 60 Hz; measured in smoke 3 at c0m 3.0 and 5.2 ms) at light frames and none at heavier ones (0 tok/s at c0m 6.7 ms), where the controller must choose unaligned pacing; sub-token (layer-level) pacing is future work and not part of this study"
  - "smoke-1 conclusions 'the guard must be learned / guard 0 unsafe' are WITHDRAWN (driver bug, journals 0041-0042); the learned controller is justified by the unseen workload and the per-workload clock choice under a power budget, not by token-timing unpredictability"
  - one GPU, one driver, one OS configuration; AC power only (the 35 W budget is an AC-powered emulation of a battery-like limit, not a battery run)
  - synthetic foreground, not a real application (W6); no image-generator background
  - CPU-side power (and the real board power outside the NVML counter) is not budgeted
  - endpoint antivirus (Avast) is active; new binaries are warmed; scanning during a run is a possible disturbance and is logged through the process list
  - the run-time figures above are estimates until tuning block 1 gives the measured cell time
reviewer_answers_applied:
  - "HW2 impossible to pass (7 blocks, 8 Holm tests): fixed - primary family is 60 W only, 10 evaluation blocks (+3 tuning), floor p = 0.00098"
  - "no unseen workload in the confirmatory test: fixed - held-out Llama-3.1-8B (never in W5a/tuning) in scene S5, REQUIRED in the reading"
  - "S3: exploratory; W5a: 280-cell stratified subset over two sessions with the held-out workload excluded"
  - "8B fallback: acceptable if chosen by the load pre-check only, never by performance (applied)"
  - "reading: S5 required, 'no loss elsewhere' replaced by a non-inferiority margin of 0.95 judged by the CI lower bound of the paired ratio in S0 and S2 (applied)"
  - "learned guard explicit in d'B (applied); Armoury mode and Chrome recorded in every run's meta.json (applied)"
decisions_2026_10_22_applied:
  - "non-inferiority comparator: d'B >= 95% of EACH of c'B, g'B and eB (CI lower bound of the paired ratio), fixed in advance (applied in HW2)"
  - "d'B is a hybrid: idle branch = eB rule, active branch = learned model with learned guard (implemented test-first in controllers/hybrid.py, tests/test_hybrid.py; docs/W45_PLAN.md addendum F; journals 0040, 0041)"
  - "smoke 3 done and recorded (journal 0043); feasibility gate extended with a >= 20% of background-alone tok/s condition; c0 defined as nominal cost with the measured frame time recorded (c0m), grid unchanged; clean-token staleness check pre-stated (HW7)"
  - "smoke-1 conclusion withdrawn; granularity limitation recorded; c0 grid; clean-token estimate implemented (reviewer 2026-10-23; journal 0042)"
  - "smoke 2 done: guard-0 overrun = driver bug (journal 0041); smoke 3 (fixed fit test, frame costs 4/7/9 ms) comes before W5a (stage order below)"
  - "S2 non-inferiority kept, relabelled a hand-over safety check (reviewer answer)"
  - "reset_probe (12/12 resets succeeded, busy and idle, locked and unlocked) did not reproduce the smoke-1 reset errors; helper handling unchanged (journal 0040)"
stage_order: "smoke 2 (done) -> smoke 3 (fixed gate) -> addendum -> W5a (tuning/held-out load pre-check addendum first) -> model selection and freeze -> W5b tuning blocks 1-3 -> evaluation blocks 4-13"
open_questions_for_the_reviewer:
  - "none open. Draft 3b is presented for FINAL review before commit and W5a."

