<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Arial, Segoe UI, sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1b2630"/></marker></defs>
<rect x="10" y="12" width="190" height="60" rx="5" fill="#f4f6f7" stroke="#1b2630" stroke-width="1.1"/>
<text x="105.0" y="30" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b2630">Foreground app</text>
<text x="105.0" y="46" text-anchor="middle" font-size="9.3" fill="#4a5a66">60 Hz frame loop</text>
<text x="105.0" y="59" text-anchor="middle" font-size="9.3" fill="#4a5a66">frame ring: arrival, start, end</text>
<rect x="225" y="12" width="190" height="60" rx="5" fill="#e1f0ed" stroke="#1b2630" stroke-width="1.1"/>
<text x="320.0" y="30" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b2630">Slack hints</text>
<text x="320.0" y="46" text-anchor="middle" font-size="9.3" fill="#4a5a66">40-byte seqlock record: busy flag,</text>
<text x="320.0" y="59" text-anchor="middle" font-size="9.3" fill="#4a5a66">next deadline, update time</text>
<rect x="440" y="12" width="190" height="60" rx="5" fill="#f4f6f7" stroke="#1b2630" stroke-width="1.1"/>
<text x="535.0" y="30" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b2630">Gated llama.cpp driver</text>
<text x="535.0" y="46" text-anchor="middle" font-size="9.3" fill="#4a5a66">starts a token only if it fits;</text>
<text x="535.0" y="59" text-anchor="middle" font-size="9.3" fill="#4a5a66">clean-token estimate, token ring</text>
<line x1="200" y1="42" x2="225" y2="42" stroke="#1b2630" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="415" y1="42" x2="440" y2="42" stroke="#1b2630" stroke-width="1.1" marker-end="url(#a)"/>
<rect x="225" y="128" width="190" height="66" rx="5" fill="#e1f0ed" stroke="#1b2630" stroke-width="1.1"/>
<text x="320.0" y="146" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b2630">Governor, 10 Hz</text>
<text x="320.0" y="162" text-anchor="middle" font-size="9.3" fill="#4a5a66">grey-box model, online calibration,</text>
<text x="320.0" y="175" text-anchor="middle" font-size="9.3" fill="#4a5a66">safety margin, power headroom,</text>
<text x="320.0" y="188" text-anchor="middle" font-size="9.3" fill="#4a5a66">pacing-mode hysteresis, fail-safe</text>
<line x1="105" y1="72" x2="270" y2="128" stroke="#1b2630" stroke-width="1.1" marker-end="url(#a)"/>
<text x="118" y="108" text-anchor="start" font-size="9" fill="#0e7469">frame latencies</text>
<line x1="535" y1="72" x2="380" y2="128" stroke="#1b2630" stroke-width="1.1" marker-end="url(#a)"/>
<text x="522" y="108" text-anchor="end" font-size="9" fill="#0e7469">token durations</text>
<line x1="320" y1="128" x2="535" y2="76" stroke="#1b2630" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="470" y="150" text-anchor="middle" font-size="9" fill="#0e7469">control block: mode, duty, guard</text>
<rect x="10" y="128" width="190" height="66" rx="5" fill="#f4f6f7" stroke="#1b2630" stroke-width="1.1"/>
<text x="105.0" y="146" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1b2630">NVML sampled power</text>
<text x="105.0" y="162" text-anchor="middle" font-size="9.3" fill="#4a5a66">250 Hz power and SM clock;</text>
<text x="105.0" y="175" text-anchor="middle" font-size="9.3" fill="#4a5a66">the energy counter is read twice</text>
<text x="105.0" y="188" text-anchor="middle" font-size="9.3" fill="#4a5a66">per 60 s window, never in the loop</text>
<line x1="200" y1="161" x2="225" y2="161" stroke="#1b2630" stroke-width="1.1" marker-end="url(#a)"/>
<rect x="225" y="248" width="190" height="62" rx="5" fill="#fbeee9" stroke="#1b2630" stroke-width="1.1"/>
<text x="320.0" y="266" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b2630">Clock service (elevated)</text>
<text x="320.0" y="282" text-anchor="middle" font-size="9.3" fill="#4a5a66">named pipe; allowlisted lock values;</text>
<text x="320.0" y="295" text-anchor="middle" font-size="9.3" fill="#4a5a66">rate limit 1 s; watchdog 3 s</text>
<line x1="320" y1="194" x2="320" y2="248" stroke="#1b2630" stroke-width="1.1" marker-end="url(#a)"/>
<text x="330" y="224" text-anchor="start" font-size="9" fill="#0e7469">lock / reset SM clock</text>
<rect x="440" y="248" width="190" height="62" rx="5" fill="#f4f6f7" stroke="#1b2630" stroke-width="1.1"/>
<text x="535.0" y="266" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1b2630">GPU (RTX 4070 Laptop, WDDM)</text>
<text x="535.0" y="282" text-anchor="middle" font-size="9.3" fill="#4a5a66">time-sliced between the two processes</text>
<line x1="415" y1="279" x2="440" y2="279" stroke="#1b2630" stroke-width="1.1" marker-end="url(#a)"/>
<text x="10" y="236" font-size="9" fill="#4a5a66">test harness: pre-registered cell lists, preflight,</text>
<text x="10" y="249" font-size="9" fill="#4a5a66">per-cell integrity checks, session integrity report</text>
</svg>