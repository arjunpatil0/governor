[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-governor"
version = "1.0.0"
description = "Frame-slack hint and deadline gate for sharing one GPU between a deadline-bound app and a background worker (Windows)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []                      # the package itself uses only the standard library

[project.optional-dependencies]
sim = ["numpy", "pandas", "scipy"]     # the plant simulator (sim/), the analysis and the examples that use it
dashboard = ["numpy", "psutil", "nvidia-ml-py", "pywin32; sys_platform == 'win32'"]
test = ["pytest", "numpy", "pandas", "scipy", "psutil", "pyyaml", "matplotlib", "nvidia-ml-py", "pywin32; sys_platform == 'win32'"]   # the full suite also needs MSVC for the C tests and a GPU for the hardware tests

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["governor", "slackhint"]
